services:
  banco:
    image: postgres:17
    environment:
      POSTGRES_DB: fogo
      POSTGRES_USER: fogo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fogo_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fogo -d fogo"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dados_postgres:
